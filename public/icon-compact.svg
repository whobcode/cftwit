    <path d="M92 432 C 118 388, 174 370, 200 352 C 210 344, 212 330, 210 316
             C 180 290, 162 248, 162 206 C 162 146, 202 104, 256 104
             C 310 104, 350 146, 350 206 C 350 248, 332 290, 302 316
             C 300 330, 302 344, 312 352 C 338 370, 394 388, 420 432"/>
  </g>
</svg>
