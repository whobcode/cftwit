<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="wash" cx="50%" cy="38%" r="68%">
      <stop offset="0" stop-color="#2a0a0c"/>
      <stop offset="1" stop-color="#07070a"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#wash)"/>

  <g fill="none" stroke="#ff2a2a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- one continuous tube: shoulder, neck, jaw, crown, jaw, neck, shoulder -->
