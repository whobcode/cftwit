             C 176 292, 158 250, 158 208 C 158 146, 200 104, 256 104
             C 312 104, 354 146, 354 208 C 354 250, 336 292, 306 318
             C 304 332, 306 348, 316 356 C 342 374, 400 392, 424 436"/>
    <!-- ears -->
    <path d="M158 212 C 140 204, 128 214, 130 230 C 132 246, 146 252, 160 248"/>
    <path d="M354 212 C 372 204, 384 214, 382 230 C 380 246, 366 252, 352 248"/>
