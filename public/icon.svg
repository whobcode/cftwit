<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- The light the group stands in. It fades the whole way out rather than
         holding full white and then dropping, so the mark dissolves into
         whatever is behind it instead of sitting on a white badge. -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.88"/>
      <stop offset="0.68" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <g id="bust" fill="#222a35">
      <circle cx="0" cy="-56" r="44"/>
      <path d="M-74 78 C -74 22, -38 0, 0 0 C 38 0, 74 22, 74 78 Z"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#halo)"/>
  <g transform="translate(256 262)">
      <use href="#bust" transform="translate(-124 -14) scale(0.6)" opacity="0.2"/>
      <use href="#bust" transform="translate(124 -14) scale(0.6)" opacity="0.2"/>
      <use href="#bust" transform="translate(-70 8) scale(0.78)" opacity="0.45"/>
      <use href="#bust" transform="translate(70 8) scale(0.78)" opacity="0.45"/>
      <use href="#bust" transform="translate(0 28) scale(1)"/>
  </g>
</svg>
